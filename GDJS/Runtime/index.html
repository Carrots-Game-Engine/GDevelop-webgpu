<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <link rel="manifest" href="manifest.webmanifest">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<style>
		body {
			margin: 0;
			padding: 0;
			background-color: #000000;
            overflow: hidden;
		}
        #canvasArea {
            margin-left: auto;
            margin-right: auto;
            overflow: hidden;
        }

        /* GDJS_CUSTOM_STYLE */
	</style>
    <!--
      Three.js backend selection — runs synchronously before any other script.

      Priority order (first match wins):
        1. URL parameter  ?threeBackend=webgpu  (dev/testing override)
        2. gdjs.projectData.properties.threeBackend  (set by the project)
        3. Default: "webgl"

      Only one of three.js / three-webgpu.js is ever loaded in a page.
      Loading both would create two separate module instances and break
      instanceof checks (isMesh, isObject3D, …).
    -->
    <script>
    (function() {
      var backend = 'webgl';

      // 1. URL param override (useful for testing without rebuilding)
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get('threeBackend') === 'webgpu') backend = 'webgpu';
      } catch(e) {}

      // 2. Project data (available when the data.js script has already run,
      //    which happens in exported builds where data.js is listed before
      //    index.html scripts — in previews the ExporterHelper will inject
      //    the correct script tag directly via GDJS_CODE_FILES).
      try {
        if (typeof gdjs !== 'undefined' &&
            gdjs.projectData &&
            gdjs.projectData.properties &&
            gdjs.projectData.properties.threeBackend === 'webgpu') {
          backend = 'webgpu';
        }
      } catch(e) {}

      // Expose for any script that loads after this snippet.
      window.__gdThreeBackend = backend;

      // ── Three.js loader ──────────────────────────────────────────────────
      // Inject the correct Three.js build synchronously via document.write so
      // that window.THREE is populated before any GDJS_CODE_FILES script runs.
      //
      // • WebGL  → three.js        (classic UMD, same as before)
      // • WebGPU → three-webgpu.js (UMD with WebGPURenderer)
      //
      // GDJS_CODE_FILES still contains a <script src="three.js"> tag injected
      // by ExporterHelper.  To avoid loading it a second time when backend is
      // webgpu, the UMD wrapper in three.js assigns to window.THREE only when
      // that global is not already set; we rely on that guard here.
      // (Both files set globalThis.THREE via the UMD factory.)
      if (backend === 'webgpu') {
        // Derive the base URL from the three.js script tag that ExporterHelper
        // will inject — or fall back to a relative path for exported builds.
        var threeBase = '';
        try {
          // In a preview, GDJS is served from an absolute URL (localhost:5002).
          // Find the base by locating any existing pixi-renderers script, or
          // use a path relative to the current document.
          var scripts = document.getElementsByTagName('script');
          for (var si = 0; si < scripts.length; si++) {
            var src = scripts[si].src || '';
            if (src.indexOf('pixi-renderers/') !== -1) {
              threeBase = src.substring(0, src.indexOf('pixi-renderers/'));
              break;
            }
          }
        } catch(e) {}
        // document.write is synchronous: the browser will block further
        // parsing until three-webgpu.js is fetched and executed, which is
        // exactly what we need so that window.THREE is ready for all
        // subsequent scripts in GDJS_CODE_FILES.
                        document.write(
          '<script src="' + threeBase + 'pixi-renderers/three-webgpu.js"></' + 'script>'
        );
        
      }
    })();
    </script>
    <!-- Libs and GDJS core files : -->
	<!-- GDJS_CODE_FILES -->

</head>
<body>

    <!-- GDJS_CUSTOM_HTML -->
	<script>

    (function() {
        //Check the game files were all loaded (in a preview, they can be exported
        //again while this page is still loading them).
        if (!gdjs.projectData) {
            throw new Error(
                "The game data was not loaded: some files of the game are missing or could not be read."
            );
        }

        //Initialization
        var game = new gdjs.RuntimeGame(gdjs.projectData, {}/*GDJS_ADDITIONAL_SPEC*/);

        //Create a renderer
        game.getRenderer().createStandardCanvas(document.body);

        //Bind keyboards/mouse/touch events
        game.getRenderer().bindStandardEvents(game.getInputManager(), window, document);

        //Load all assets and start the game
        game.loadAllAssets(function() {
            game.startGameLoop();
        });
    })();

	</script>
</body>
</html>
